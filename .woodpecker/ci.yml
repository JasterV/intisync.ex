when:
  - event: [push, pull_request]
    branch: main

steps:
  ci:
    image: elixir:1.19.2-otp-28
    environment:
      MIX_ENV: test
    commands:
      - mix local.rebar --force
      - mix local.hex --force
      - mix deps.get
      - mix compile --warnings-as-errors
      - mix format --check-formatted
      - mix credo
      - mix test
